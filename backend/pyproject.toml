[project]
name = "localads-backend"
version = "0.1.0"
description = "Local Advertising Map Platform backend (Django 5.2 modular monolith)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django~=5.2.0",
    "djangorestframework~=3.16.0",
    "drf-spectacular~=0.28.0",
    "django-filter~=25.1",
    "django-cors-headers~=4.7.0",
    "django-environ~=0.12.0",
    "django-storages[s3]~=1.14.0",
    "psycopg[binary]~=3.2.0",
    "celery[redis]~=5.5.0",
    "redis~=5.2.0",
    "Pillow~=11.2.0",
    "gunicorn~=23.0.0",
    "whitenoise~=6.9.0",
]

[dependency-groups]
dev = [
    "ruff~=0.11.0",
    "mypy~=1.15.0",
    "django-stubs[compatible-mypy]~=5.2.0",
    "djangorestframework-stubs[compatible-mypy]~=3.16.0",
    "pytest~=8.3.0",
    "pytest-django~=4.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "apps"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "DJ", "T20"]
ignore = ["DJ001"]  # nullable author FKs are deliberate (audit rows survive user deletion)

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q"
