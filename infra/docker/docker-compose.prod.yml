# Production stack (spec §15): one VPS, manual reproducible deployment.
# Copy to the server, create .env.prod next to it (never committed), then:
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file .env.prod up -d
# Only the proxy publishes ports; DB/Redis/MinIO stay on the internal network.
name: local-ads-prod

x-web-env: &web-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  USE_S3: "true"
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET_NAME: localads-media
  REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  DATABASE_URL: postgis://localads:${POSTGRES_PASSWORD}@db:5432/localads

services:
  proxy:
    image: nginx:1.27-alpine
    depends_on: [web]
    ports:
      - "80:80"
      # - "443:443"  # enable after TLS certs exist
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../../frontend/dist:/var/www/frontend:ro
    networks: [frontend_net]

  web:
    build: ../../../backend
    image: localads-backend:${TAG:-latest}
    env_file: ${ENV_FILE:-.env.prod}
    environment: *web-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - backend_static:/app/staticfiles
    networks: [frontend_net, backend_net]
    restart: unless-stopped

  worker:
    image: localads-backend:${TAG:-latest}
    command: celery -A config worker -l info -Q default
    env_file: ${ENV_FILE:-.env.prod}
    environment: *web-env
    depends_on: [web]
    networks: [backend_net]
    restart: unless-stopped

  beat:
    image: localads-backend:${TAG:-latest}
    command: celery -A config beat -l info --schedule-file=/data/celerybeat-schedule
    env_file: ${ENV_FILE:-.env.prod}
    environment: *web-env
    depends_on: [web]
    volumes:
      - beat_schedule:/data
    networks: [backend_net]
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: localads
      POSTGRES_USER: localads
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localads -d localads"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks: [backend_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks: [backend_net]
    restart: unless-stopped

networks:
  frontend_net:
  backend_net:

volumes:
  pgdata:
  minio_data:
  beat_schedule:
  backend_static:
