# Reverse proxy: TLS termination + built SPA + proxy to Django.
#
# TLS: certificates are expected at infra/nginx/certs/{fullchain,privkey}.pem
# (obtain once with certbot BEFORE first `up -d` — see docs/runbooks/deploy.md).
# HTTP (port 80) only answers ACME challenges and redirects everything else.
upstream django_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # certbot --webroot renewal path (mounted at infra/nginx/certbot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;  # media upload limit is 5 MB server-side

    # Built SPA (docker compose mounts frontend/dist)
    root /var/www/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite build output only — must NOT catch /static/ or /media/
    # (they proxy to Django; `^~` on those blocks prevents regex matching).
    location ~* ^/assets/.+\.(js|css|png|jpg|jpeg|webp|svg|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # `^~` prefix blocks win over the regex above.
    location ^~ /api/ {
        proxy_pass http://django_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location ^~ /admin/ {
        proxy_pass http://django_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files (whitenoise) and media (Garage via Django view)
    location ^~ /static/ {
        proxy_pass http://django_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /media/ {
        proxy_pass http://django_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/ {
        proxy_pass http://django_web;
        proxy_set_header Host $host;
    }
}
