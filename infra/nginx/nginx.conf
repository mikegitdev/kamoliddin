# Reverse proxy: serves the built frontend, proxies /api, /admin, /static,
# /media to the Django container. TLS termination assumed upstream or via
# certbot sidecar — see docs/runbooks/deploy.md (spec §15).
upstream django_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Built SPA (docker compose mounts frontend/dist)
    root /var/www/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_pass http://django_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /admin/ {
        proxy_pass http://django_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://django_web;
    }

    location /media/ {
        proxy_pass http://django_web;
    }

    location /health/ {
        proxy_pass http://django_web;
    }
}
