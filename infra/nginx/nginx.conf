# Reverse proxy: TLS termination + built SPA + proxy to Django.
#
# TLS: certificates are expected at infra/nginx/certs/{fullchain,privkey}.pem
# (obtain once with certbot BEFORE first `up -d` — see docs/runbooks/deploy.md).
# HTTP (port 80) only answers ACME challenges and redirects everything else.
upstream django_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # certbot --webroot renewal path (mounted at infra/nginx/certbot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;  # media upload limit is 5 MB server-side

    # Defense-in-depth XSS boundary: the SPA loads no third-party scripts by
    # design, so script-src 'self' blocks any injected inline/remote script.
    # Styles allow 'unsafe-inline' (React style props); images/connect allow
    # any https host because the licensed tile provider (2GIS or an OSM host,
    # spec §19 [E]) is deploy-time configuration — tighten img-src/connect-src
    # to that host once it is known.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; "
        "img-src * data: blob:; connect-src 'self' https:; font-src 'self'; "
        "worker-src blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";

    # Compress API JSON and SPA chunks (whitenoise pre-compresses /static/
    # itself and serves the .gz via gzip_static below; text/html is implied).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Built SPA (docker compose mounts frontend/dist)
    root /var/www/frontend;
    index index.html;

    # SPA entry must always revalidate: a cached index pins users to stale
    # hashed chunks that 404 after a release.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite build output only — must NOT catch /static/ or /media/
    # (they proxy to Django; `^~` on those blocks prevents regex matching).
    location ~* ^/assets/.+\.(js|css|png|jpg|jpeg|webp|svg|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # `^~` prefix blocks win over the regex above.
    location ^~ /api/ {
        proxy_pass http://django_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location ^~ /admin/ {
        proxy_pass http://django_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files: whitenoise's hashed output lives in the shared
    # backend_static volume — serve it here (gzip_static picks up whitenoise's
    # pre-compressed .gz) so static traffic never occupies a gunicorn worker.
    # /media/ stays proxied to Django (server-mediated reads, spec §11).
    location ^~ /static/ {
        alias /var/www/static/;
        gzip_static on;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /media/ {
        proxy_pass http://django_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/ {
        proxy_pass http://django_web;
        proxy_set_header Host $host;
    }
}
