# Dev infrastructure for the Local Advertising monorepo (spec §15).
# Production topology (proxy/web/worker/beat) is added in infra/ once images exist.
name: local-ads

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: localads
      POSTGRES_USER: localads
      POSTGRES_PASSWORD: localads
    ports:
      - "5432:5432"
    volumes:
      - .docker-data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localads -d localads"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Garage S3-compatible object storage (spec §15; ADR-0002).
  # --single-node auto-assigns the layout; --default-bucket creates the
  # localads-media bucket + the dev access key from GARAGE_DEFAULT_* env
  # (idempotent across restarts — verified on dxflrs/garage:v2.4.1).
  # Fully private: public media reads are served by Django's MediaServeView
  # (apps/core/media.py, spec §11), which streams from this bucket.
  garage:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK1f5d0333ca9c2ee30a6718a78d0282fa
      GARAGE_DEFAULT_SECRET_KEY: e7024f746ec17e2814c5cb8d5371a0b8a96b1aacfa512265430715770f76aadf
      GARAGE_DEFAULT_BUCKET: localads-media
    ports:
      - "3900:3900"   # S3 API (backend uploads/reads; never anonymous)
    volumes:
      - .docker-data/garage:/var/lib/garage
      - ./infra/docker/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 5s
      timeout: 3s
      retries: 10
