# Dev infrastructure for the Local Advertising monorepo (spec §15).
# Production topology (proxy/web/worker/beat) is added in infra/ once images exist.
name: local-ads

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: localads
      POSTGRES_USER: localads
      POSTGRES_PASSWORD: localads
    ports:
      - "5432:5432"
    volumes:
      - .docker-data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localads -d localads"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API (backend)
      - "9001:9001"   # web console
    volumes:
      - .docker-data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/localads-media &&
      mc anonymous set download local/localads-media &&
      echo 'MinIO bucket ready (public read for media objects)'"
